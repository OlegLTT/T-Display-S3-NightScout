<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1110" viewBox="0 0 1160 1110" role="img" aria-labelledby="title desc"><title id="title">Веб-настройки · окно в браузере</title><desc id="desc">Общая форма для обеих плат. Домен, Wi-Fi и значения показаны для примера.</desc><rect x="0" y="0" width="1160" height="1110" rx="20" fill="#f4f7fb" stroke="none" stroke-width="1"/><text x="36" y="44" fill="#172b43" font-size="28" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Веб-настройки · окно в браузере</text><text x="36" y="75" fill="#52677e" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Общая форма для обеих плат. Домен, Wi-Fi и значения показаны для примера.</text><rect x="58" y="108" width="670" height="925" rx="16" fill="#fff" stroke="#dae3ee" stroke-width="1"/><rect x="58" y="108" width="670" height="40" rx="16" fill="#e5ebf2" stroke="none" stroke-width="1"/><text x="90" y="134" fill="#52677e" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">192.168.4.1</text><text x="84" y="184" fill="#172b43" font-size="26" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Настройки устройства</text><text x="84" y="210" fill="#52677e" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Параметры сохраняются на этом устройстве</text><rect x="82" y="229" width="621" height="174" rx="10" fill="#f4f6f8" stroke="none" stroke-width="1"/><text x="100" y="254" fill="#172b43" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Адрес сервера Nightscout</text><rect x="100" y="264" width="585" height="36" rx="7" fill="#fff" stroke="#b9c6d6" stroke-width="1"/><text x="112" y="288" fill="#172b43" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">ns.example.org</text><text x="100" y="332" fill="#172b43" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Токен доступа (если требуется)</text><rect x="100" y="342" width="585" height="36" rx="7" fill="#fff" stroke="#b9c6d6" stroke-width="1"/><text x="112" y="366" fill="#172b43" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">••••••••••••••••</text><rect x="82" y="416" width="621" height="149" rx="10" fill="#f4f6f8" stroke="none" stroke-width="1"/><text x="100" y="445" fill="#172b43" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Wi-Fi · приоритет сверху вниз</text><text x="100" y="478" fill="#172b43" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Сеть 1 · SSID и пароль</text><rect x="100" y="488" width="585" height="36" rx="7" fill="#fff" stroke="#b9c6d6" stroke-width="1"/><text x="112" y="512" fill="#172b43" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Home Wi-Fi      ••••••••          ↑  ↓</text><text x="100" y="551" fill="#52677e" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Ещё 4 слота ниже · показан один для примера</text><rect x="82" y="578" width="621" height="91" rx="10" fill="#f4f6f8" stroke="none" stroke-width="1"/><text x="100" y="605" fill="#172b43" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Источник заряда батареи на экране</text><rect x="100" y="615" width="585" height="36" rx="7" fill="#fff" stroke="#b9c6d6" stroke-width="1"/><text x="112" y="639" fill="#172b43" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Blueberry                                      ▾</text><rect x="82" y="682" width="621" height="127" rx="10" fill="#f4f6f8" stroke="none" stroke-width="1"/><text x="100" y="710" fill="#172b43" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Часовой пояс</text><rect x="100" y="720" width="585" height="36" rx="7" fill="#fff" stroke="#b9c6d6" stroke-width="1"/><text x="112" y="744" fill="#172b43" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">UTC+05:00                                    ▾</text><text x="100" y="792" fill="#172b43" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Летнее время: выкл</text><rect x="82" y="822" width="621" height="92" rx="10" fill="#f4f6f8" stroke="none" stroke-width="1"/><text x="100" y="850" fill="#172b43" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Громкость: 31%</text><path d="M108 881 H673" fill="none" stroke="#c5ced8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M108 881 H283" fill="none" stroke="#176bce" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="283" cy="881" r="9" fill="#176bce"/><rect x="84" y="929" width="270" height="42" rx="8" fill="#1976d2" stroke="none" stroke-width="1"/><text x="219" y="957" fill="#fff" font-size="17" font-weight="400" text-anchor="middle" font-family="Arial, sans-serif">Сохранить и выйти</text><rect x="366" y="929" width="313" height="42" rx="8" fill="#333" stroke="none" stroke-width="1"/><text x="522" y="957" fill="#fff" font-size="17" font-weight="400" text-anchor="middle" font-family="Arial, sans-serif">Выйти без сохранения</text><text x="84" y="1007" fill="#b71c1c" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Сброс устройства…</text><path d="M758 292 L688 292" fill="none" stroke="#176bce" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="688" cy="292" r="3" fill="#176bce"/><circle cx="758" cy="292" r="13" fill="#176bce"/><text x="758" y="297" fill="white" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">1</text><text x="782" y="289" fill="#172b43" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Сервер и токен</text><text x="782" y="314" fill="#52677e" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Источник данных Nightscout</text><path d="M758 491 L688 491" fill="none" stroke="#176bce" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="688" cy="491" r="3" fill="#176bce"/><circle cx="758" cy="491" r="13" fill="#176bce"/><text x="758" y="496" fill="white" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">2</text><text x="782" y="488" fill="#172b43" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Сети Wi-Fi</text><text x="782" y="513" fill="#52677e" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">До 5 сетей и порядок подключения</text><path d="M758 625 L688 625" fill="none" stroke="#176bce" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="688" cy="625" r="3" fill="#176bce"/><circle cx="758" cy="625" r="13" fill="#176bce"/><text x="758" y="630" fill="white" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">3</text><text x="782" y="622" fill="#172b43" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Источник батареи</text><text x="782" y="647" fill="#52677e" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Blueberry или помпа</text><path d="M758 739 L688 739" fill="none" stroke="#176bce" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="688" cy="739" r="3" fill="#176bce"/><circle cx="758" cy="739" r="13" fill="#176bce"/><text x="758" y="744" fill="white" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">4</text><text x="782" y="736" fill="#172b43" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Местное время</text><text x="782" y="761" fill="#52677e" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Часовой пояс и летнее время</text><path d="M758 867 L688 867" fill="none" stroke="#176bce" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="688" cy="867" r="3" fill="#176bce"/><circle cx="758" cy="867" r="13" fill="#176bce"/><text x="758" y="872" fill="white" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">5</text><text x="782" y="864" fill="#172b43" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Громкость</text><text x="782" y="889" fill="#52677e" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">0% полностью отключает звук</text><path d="M758 955 L688 955" fill="none" stroke="#176bce" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="688" cy="955" r="3" fill="#176bce"/><circle cx="758" cy="955" r="13" fill="#176bce"/><text x="758" y="960" fill="white" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">6</text><text x="782" y="952" fill="#172b43" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Завершение настройки</text><text x="782" y="977" fill="#52677e" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Обе кнопки перезагружают дисплей</text><path d="M758 1002 L688 1002" fill="none" stroke="#176bce" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="688" cy="1002" r="3" fill="#176bce"/><circle cx="758" cy="1002" r="13" fill="#176bce"/><text x="758" y="1007" fill="white" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">7</text><text x="782" y="999" fill="#172b43" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Сброс параметров</text><text x="782" y="1024" fill="#52677e" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Очищает сохранённые настройки</text><text x="36" y="1070" fill="#52677e" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Схема формы сокращена. Пороги глюкозы задаются в Nightscout, на этой странице их полей нет.</text><text x="36" y="1090" fill="#52677e" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Nightscout Monitor · Схема интерфейса · Данные для примера</text></svg>
