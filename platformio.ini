; PlatformIO Project Configuration File

[platformio]
default_envs = lilygo-t-display-s3

; -------- Общие настройки для всех плат --------
[env]
platform        = espressif32
framework       = arduino
monitor_filters = esp32_exception_decoder
monitor_speed   = 115200
upload_protocol = esptool
debug_tool      = esp-builtin

; общие библиотеки
lib_deps =
   ; bodmer/TFT_eSPI@^2.5.43
  ;  bblanchon/ArduinoJson@^7.4.2
    paulstoffregen/Time@^1.6.1
   ; ricmoo/QRCode@^0.0.1
    lvgl/lvgl@^9.4.0
    gyverlibs/GSON
    gyverlibs/StringUtils

; общие флаги компиляции
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS


; -------- 1) LilyGO T-Display S3 --------
[env:lilygo-t-display-s3]
board        = lilygo-t-display-s3
upload_speed = 460800

lib_deps =
  ${env.lib_deps}
  gyverlibs/uButton

build_flags =
    ${env.build_flags}
    -DBOARD_TDISPLAY_S3
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DTOUCH_MODULES_CST_MUTUAL
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_24=1


; -------- 2) M5CoreS3 --------
[env:m5cores3]
board        = m5stack-cores3
upload_speed = 460800

; если будет ругаться на несколько портов — можно временно раскомментить:
; upload_port  = COM9
; monitor_port = COM9

lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified

build_flags =
    ${env.build_flags}
    -DBOARD_M5CORES3


; -------- 3) Waveshare ESP32-S3 1.43" AMOLED --------
[env:esp32s3-devkit]
board        = esp32-s3-devkitc-1
upload_speed = 460800

; при необходимости можно явно задать:
upload_port  = COM11
monitor_port = COM11

; build_flags =
;     ${env.build_flags}
;     -DBOARD_ESP32S3_DEV

; lib_deps =
;     ${env.lib_deps}
;     ; внешнюю lvgl из реестра НЕ добавляем, у нас локальная в lib/

build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3_DEV
    -DLV_CONF_INCLUDE_SIMPLE    ; чтобы lvgl нашёл lv_conf.h в include/
