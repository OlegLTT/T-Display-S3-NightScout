; PlatformIO Project Configuration File

[platformio]
default_envs = lilygo-t-display-s3

; -------- Общие настройки для всех плат --------
[env]
platform        = espressif32
framework       = arduino
monitor_filters = esp32_exception_decoder
monitor_speed   = 115200
upload_protocol = esptool

; общие библиотеки
lib_deps =
    paulstoffregen/Time@^1.6.1
    lvgl/lvgl@^9.4.0
    gyverlibs/GSON
    gyverlibs/StringUtils

; общие флаги компиляции
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS


; -------- 1) LilyGO T-Display S3 --------
[env:lilygo-t-display-s3]
platform     = espressif32@6.12.0
board        = lilygo-t-display-s3
debug_tool   = esp-builtin
upload_speed = 460800
extra_scripts = post:scripts/relative_map_path.py

lib_deps =
  ${env.lib_deps}
  gyverlibs/uButton

build_flags =
    ${env.build_flags}
    -DBOARD_TDISPLAY_S3
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DTOUCH_MODULES_CST_MUTUAL
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_24=1


; -------- 2) M5CoreS3 / CoreS3 SE --------
[env:m5cores3]
platform     = espressif32@6.12.0
board        = m5stack-cores3
debug_tool   = esp-builtin
upload_speed = 460800
; CoreS3 / SE use Quad PSRAM.
board_build.arduino.memory_type = qio_qspi
extra_scripts = post:scripts/relative_map_path.py

; если будет ругаться на несколько портов — можно временно раскомментить:
; upload_port  = COM9
; monitor_port = COM9

lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified@0.2.13
    m5stack/M5GFX@0.2.29

build_flags =
    ${env.build_flags}
    -DBOARD_M5CORE_S3=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DLV_COLOR_DEPTH=16


; -------- 3) M5Stack Core Basic / Gray (ESP32, buttons A/B/C) --------
[env:m5stack]
platform     = espressif32@6.12.0
board        = m5stack-core-esp32
upload_speed = 460800
; 4 MB flash, no PSRAM required. Firmware uses a single 3 MB app partition.
board_build.partitions = huge_app.csv
extra_scripts = post:scripts/relative_map_path.py

lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified@0.2.13
    m5stack/M5GFX@0.2.29

; Classic ESP32 uses a USB-UART bridge, without the ESP32-S3 USB flags.
build_flags =
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DBOARD_M5STACK=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DLV_COLOR_DEPTH=16
